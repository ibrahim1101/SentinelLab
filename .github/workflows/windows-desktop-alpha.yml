name: Windows Desktop Alpha Installer
on:
  workflow_dispatch:
  push:
    branches: ["fix/phase1-security-regressions"]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/windows-desktop-alpha.yml"
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate branded SentinelLab application icons
        shell: pwsh
        run: |
          python -m pip install Pillow
          @'
          from PIL import Image
          from pathlib import Path
          source = Path("frontend/public/Neon Global Shield Emblem.png")
          if not source.is_file():
              raise SystemExit(f"Missing branded shield: {source}")
          image = Image.open(source).convert("RGBA")
          # Keep the shield artwork and its internal world map; avoid replacing it with a generic placeholder.
          image.thumbnail((512, 512), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          canvas.alpha_composite(image, ((512 - image.width) // 2, (512 - image.height) // 2))
          canvas.save("desktop/sentinellab-icon.png")
          '@ | python -
          cd desktop
          npx tauri icon sentinellab-icon.png
      - name: Build bundled FastAPI executable
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.runtime.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --name sentinellab-api --distpath desktop/src-tauri/binaries --collect-submodules uvicorn --collect-submodules motor --collect-submodules pymongo --hidden-import server --hidden-import core --hidden-import parsers --hidden-import detection --hidden-import seed --hidden-import ai_assistant --hidden-import playbooks --hidden-import mitre_data --paths backend backend/desktop_entry.py
          $target = (rustc -vV | Select-String "^host: ").ToString().Split(" ")[1]
          Move-Item desktop/src-tauri/binaries/sentinellab-api.exe "desktop/src-tauri/binaries/sentinellab-api-$target.exe"
          if (!(Test-Path "desktop/src-tauri/binaries/sentinellab-api-$target.exe")) { throw "Backend executable missing" }
      - name: Smoke-test bundled backend executable
        shell: pwsh
        run: |
          $target = (rustc -vV | Select-String "^host: ").ToString().Split(" ")[1]
          $exe = "desktop/src-tauri/binaries/sentinellab-api-$target.exe"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Bundled backend import self-test failed with exit code $LASTEXITCODE" }
      - name: Build Windows NSIS installer
        working-directory: desktop
        run: npm run tauri:build
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: 'http://127.0.0.1:18765'
      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: SentinelLab-Windows-Alpha-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
