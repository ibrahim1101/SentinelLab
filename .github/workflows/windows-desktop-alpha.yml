name: Windows Desktop Alpha Installer
on:
  workflow_dispatch:
  push:
    branches: ["fix/phase1-security-regressions"]
    paths:
      - "desktop/**"
      - "frontend/**"
      - ".github/workflows/windows-desktop-alpha.yml"
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate placeholder alpha application icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path
          p = Path("desktop/alpha-icon.png")
          image = Image.new("RGBA", (512, 512), (15, 23, 36, 255))
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((72, 72, 440, 440), radius=80, outline=(72, 190, 210, 255), width=24)
          draw.line([(160, 320), (230, 180), (290, 280), (352, 160)], fill=(72, 190, 210, 255), width=28)
          image.save(p)
          '@ | python -
          cd desktop
          npx tauri icon alpha-icon.png
      - name: Build Windows NSIS installer
        working-directory: desktop
        run: npm run tauri:build
        env:
          CI: 'false'
      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: SentinelLab-Windows-Alpha-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
