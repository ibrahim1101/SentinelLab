name: Playbook regression tests
on:
  push:
    branches: [fix/phase1-security-regressions]
  workflow_dispatch:
jobs:
  playbook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-xdist pytest-asyncio motor pymongo PyJWT bcrypt fastapi python-dotenv python-multipart email-validator pydantic
      - run: python -m pytest -q backend/tests/test_playbook_regressions.py
