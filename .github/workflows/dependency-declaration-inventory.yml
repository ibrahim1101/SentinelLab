name: Dependency Declaration Inventory
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/package.json"
      - "desktop/package.json"
      - "desktop/src-tauri/Cargo.toml"
      - "backend/requirements.runtime.txt"
      - "scripts/export_dependency_declarations.py"
      - ".github/workflows/dependency-declaration-inventory.yml"
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export direct dependency declarations
        run: python scripts/export_dependency_declarations.py dependency-inventory.csv
      - name: Verify generated CSV is parseable
        run: |
          python - <<'PY'
          import csv
          with open("dependency-inventory.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert rows and all(row["license_status"] == "UNVERIFIED" for row in rows)
          print(f"Verified {len(rows)} direct dependency declarations; licenses remain unverified.")
          PY
      - name: Upload audit input (not a verified SBOM)
        uses: actions/upload-artifact@v4
        with:
          name: SentinelLab-Direct-Dependency-Declarations
          path: dependency-inventory.csv
          retention-days: 30
