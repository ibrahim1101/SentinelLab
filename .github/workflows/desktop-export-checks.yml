name: Desktop export regression checks

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'desktop/**'
      - 'backend/server.py'
      - '.github/workflows/desktop-export-checks.yml'
  push:
    branches:
      - 'fix/desktop-event-export-search'
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: CI=false npm run build

  tauri-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Create compile-only placeholder sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force desktop/src-tauri/binaries/sentinellab-api-x86_64-pc-windows-msvc.exe | Out-Null
      - name: Check native desktop code
        working-directory: desktop/src-tauri
        run: cargo check --locked
