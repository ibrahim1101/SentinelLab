name: Generate Dependency Lockfiles (Review Required)
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate frontend npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate desktop npm lockfile
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate Rust lockfile
        working-directory: desktop/src-tauri
        run: cargo generate-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated lockfiles
        run: python scripts/verify_dependency_lockfiles.py
      - name: Audit nonstandard dependency sources
        run: python scripts/audit_lockfile_sources.py dependency-source-review.csv
      - name: Record manifest hashes
        run: |
          sha256sum frontend/package.json frontend/package-lock.json desktop/package.json desktop/package-lock.json desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock > dependency-lockfile-hashes.txt
      - name: Open review PR for generated lockfiles
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            frontend/package-lock.json
            desktop/package-lock.json
            desktop/src-tauri/Cargo.lock
          branch: chore/review-generated-dependency-lockfiles
          delete-branch: true
          commit-message: 'build: generate npm and Cargo lockfiles for review'
          title: 'build: review generated npm and Cargo lockfiles'
          body: |
            Generated by the manually triggered dependency lockfile workflow.
            Review resolved dependencies, source registries, license obligations, and CI impact before merging.
            No claim of license compatibility or vulnerability clearance is made.
      - name: Upload lockfiles for review (not committed)
        uses: actions/upload-artifact@v4
        with:
          name: SentinelLab-Generated-Lockfiles-Review-Only
          path: |
            frontend/package-lock.json
            desktop/package-lock.json
            desktop/src-tauri/Cargo.lock
            dependency-lockfile-hashes.txt
            dependency-source-review.csv
          retention-days: 30
          if-no-files-found: error
