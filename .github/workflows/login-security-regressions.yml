name: Login Security Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.runtime.txt
      - run: python -m unittest discover -s backend/tests -p 'test_login_security_regressions.py' -v
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: sentinellab_test
          JWT_SECRET: ci-only-test-secret-not-for-production
          ADMIN_PASSWORD: ci-only-test-password
