# Opt-in desktop development stack. Existing Windows MongoDB data is NOT automatically migrated.
# Run explicitly: docker compose -f compose.desktop.yaml --env-file .env.desktop up -d --build
services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    volumes:
      - desktop_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18765:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:?Set DB_NAME to the verified original database name}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.desktop}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sentinellab.io}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.desktop}
      ENABLE_DEMO_ACCOUNTS: ${ENABLE_DEMO_ACCOUNTS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100,http://127.0.0.1:3100,tauri://localhost,http://tauri.localhost}
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  desktop_mongo_data:
